<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
<style>
    .custom-dropdown-menu {
        display: none;
        position: absolute;
        bottom: 65px;
        left: 24px;
        background-color: #212529;
        border: 1px solid #495057;
        border-radius: 0.375rem;
        padding: 0.5rem 0;
        list-style: none;
        margin: 0;
        z-index: 1050;
        min-width: 140px;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
    .custom-dropdown-menu.show {
        display: block;
    }
    .custom-dropdown-item {
        display: block;
        width: 100%;
        padding: 0.25rem 1rem;
        clear: both;
        font-weight: 400;
        color: #dee2e6;
        text-align: inherit;
        text-decoration: none;
        white-space: nowrap;
        background-color: transparent;
        border: 0;
        font-size: 0.875rem;
    }
    .custom-dropdown-item:hover {
        background-color: #343a40;
        color: #fff;
    }
    .custom-divider {
        height: 0;
        margin: 0.5rem 0;
        overflow: hidden;
        border-top: 1px solid #495057;
    }
    /* Фикс для курсора */
    .dropdown-trigger {
        cursor: pointer;
    }


/* Эффект при наведении — синяя полоса */
.d-flex.flex-column.gap-3 a:hover {
    color: #fff !important;
    background-color: #0d6efd; /* Синий цвет Bootstrap */
}
</style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-2 min-vh-100 p-4 d-flex flex-column justify-content-between bg-black fg-white" style="position: relative;">

            <div>
                <h3 class="mb-5 text-secondary ">Меню</h3>
                <div class="d-flex flex-column gap-3">
                    <a href="#" class=" text-decoration-none fw-bold">🏠Главная</a>
                    <a href="#" class=" text-decoration-none">📂Категории</a>
                    <a href="#" class=" text-decoration-none">📦Заказы</a>
                    <a href="#" class=" text-decoration-none">📞Контакты</a>
                </div>
            </div>

            <!-- БЛОК ПОЛЬЗОВАТЕЛЯ -->
            <div class="pt-3 border-top border-secondary">
                <div class="d-flex align-items-center text-decoration-none dropdown-trigger link-secondary" id="customDropdownBtn">
                    <span class="avatar">
                        <img class="avatar-img rounded-circle" src="../static/avatar.jpg" alt="mdo" style="width: 40px; height: 40px; object-fit: cover;">
                    </span>
                    <span class="ms-2 small text-secondary">Пользователь</span>
                </div>


                <ul class="custom-dropdown-menu" id="customDropdownMenu">
                    <li><a class="custom-dropdown-item" href="#">Профиль</a></li>
                    <li><div class="custom-divider"></div></li>
                    <li><a class="custom-dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>

       <!-- Правая сторона -->
       <div class="col-10 p-4">

    <!-- Большой отступ сверху для заголовка -->
    <div class="text-center mb-5" style="margin-top: 80px;">
        <h1 class="fw-normal">Контакты</h1>
    </div>

    <!-- justify-content-around распределит блоки с красивыми отступами по бокам -->
    <div class="row g-5 justify-content-around">

        <!-- ЛЕВАЯ КОЛОНКА: Жестко задаем col-5 для формы -->
        <div class="col-5">
            <!-- Классы border и shadow-sm добавят рамку и легкую тень как на макете -->
            <div class="card p-4 border shadow-sm">
                <form>
                    <!-- Поле: Имя -->
                    <div class="mb-3">
                        <label for="inputName" class="form-label text-muted small">Имя</label>
                        <input type="text" class="form-control" id="inputName">
                    </div>

                    <!-- Поле: Почта -->
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label text-muted small">Почта</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">@</span>
                            <input type="email" class="form-control" id="inputEmail">
                        </div>
                    </div>

                    <!-- Поле: Сообщение -->
                    <div class="mb-4">
                        <label for="inputTextarea" class="form-label text-muted small">Сообщение</label>
                        <textarea class="form-control" id="inputTextarea" rows="4"></textarea>
                    </div>

                    <!-- Кнопка отправки -->
                    <button type="submit" class="btn btn-primary px-4">Отправить</button>
                </form>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Жестко задаем col-5 для текста -->
        <div class="col-5 d-flex flex-column justify-content-start pt-2">
            <h3 class="fw-bold mb-3 fs-4">Наши контакты</h3>

            <p class="text-secondary" style="line-height: 1.6; font-size: 0.95rem;">
                Здесь указаны контактные данные
            </p>

            <p class="text-muted small mt-3">
                Здесь указана информация интересующая пользователей
            </p>
        </div>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('customDropdownBtn');
        const menu = document.getElementById('customDropdownMenu');

        // Переключение меню при клике на Пользователь
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            menu.classList.toggle('show');
        });

        // Закрытие меню при клике в любое другое место экрана
        document.addEventListener('click', function() {
            menu.classList.remove('show');
        });
    });
</script>
 </body>
</html>
